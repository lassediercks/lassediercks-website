# Static server for the generated site (`nuxi generate` -> .output/public).
# Runs as nginx-unprivileged's uid 101 on :8080 with a read-only root FS;
# the only writable path it needs is /tmp (pid + temp dirs, see nginx.conf
# of the base image), mounted as an emptyDir in the cluster.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # Privacy: no per-visitor access log here either (the ingress has
    # enable-access-log: "false" as well). Errors still go to stderr.
    access_log off;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # add_header is NOT inherited into a location that sets its own, so
    # each location repeats the security headers.

    # Hashed build assets never change under the same name.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    location / {
        # Same as Vercel served it: revalidate HTML on every request.
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/index.html =404;
    }

    # Liveness/readiness: no file lookup, no log.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
